project:
  name: "Dataset003 ICM/TE — Nuclei Tracking"
  dataset_id: "250914_stack5"

paths:
  # 3-class nnUNet predictions (0=background, 1=nuclei/TE, 2=ICM), trained on
  # contact-layer-separated instances (see prepare_nnunet.py separate_touching_instances) —
  # input to 00_preprocess_segmentation_dataset003.py
  nnunet_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/predictions/labels/"
  nnunet_glob: "*.tif"

  # Nuclear channel (H2B / Cam_long), cropped to match nnUNet inference input
  raw_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/imagesTs/tifs/"
  raw_glob: "Dataset003_*_0000.tif"

  # Instance-segmented label tiffs (one 3D tiff per timepoint)
  label_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/labels/"
  label_glob: "*_instances_reclassified.tif"

  # ERK biosensor channel (Cam_short), cropped identically to raw_dir by prepare_inference.py.
  erk_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/cam_short_cropped/"
  erk_glob: "Cam_short_*_cropped.tif"

  # ── Intermediate data ────────────────────────────────────────────────────────
  features_csv: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/features/features.csv"
  features_registered_csv: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/features/features_registered.csv"
  transforms_npz: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/features/transforms.npz"

  # ── Tracking config ──────────────────────────────────────────────────────────
  btrack_config_json: "/mnt/md0/elysse/code/embryo_image_analysis/configs/tracking/cell_config.json"

  # ── Tracking outputs ─────────────────────────────────────────────────────────
  btrack_output_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/tracks/btrack/"
  linked_tracks_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/tracks/linked/"

  # track-relabeled 4D TIFF for curation (voxel value = track_id + 1)
  track_labels_tiff: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/tracks/linked/track_labels_linked.tif"

  # ── Analysis outputs ─────────────────────────────────────────────────────────
  output_dir: "/mnt/md0/elysse/nnUNet/inference/Dataset003_icm_te/250914_stack5/results/analysis/"

microscopy:
  n_timepoints: 121
  voxel_size_zyx: [2.0, 0.208, 0.208]

tracking:
  # 03_link_tracks.py writes a literal 'tracks_linked.csv' (not versioned by
  # output_version in the filename), so input_version must be "linked" - not
  # null - for 04_curate_tracks.ipynb's f'tracks_{VERSION}.csv' to find it.
  # output_version is the curation notebook's own output naming for the first
  # corrected pass - bump this (linked_c2, c3, ...) each curation round.
  input_version: "linked"
  output_version: "linked_c1"

  # Full range by default - no known-unreliable early frames confirmed yet for
  # this dataset (unlike dataset001_implantation_250914_stack5.yaml's t_start=16
  # exclusion, which was specific to that run). Revisit after a first 02/03 pass.
  t_start: 0
  t_end: 120

  frame_interval_min: 15   # same acquisition/stack as Dataset001's 250914_stack5
  min_track_length: 5

motion:
  msd:
    max_lag_fraction: 0.5
    min_lags_for_fit: 4
  flow_field:
    k_neighbors: 6
