project:
  name: "260804_c_meki_h2b_snap_2"
  date: "2026-08-05"
  dataset: "260804_c_meki_h2b_snap_2"
  notes: ""

paths:
  raw_data_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 2/tifs"
  output_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 2/analysis"

microscopy:
  instrument: "TruLive3D"
  serial_number: "40244"
  software_version: "3.17.6-beta"

  # ZYX voxel size in microns (from processingInformation.voxel_size_um)
  voxel_size_zyx_um: [1.250, 0.184, 0.184] #not correct metadata, unsure what z res is 
  image_size_zyx: [91, 2368, 4432]

  detection_objective:
    model: ""  # TODO: not in Cam_*.json — fill in from the scope's objective config
    magnification: 25.0
    na: 1.1
    immersion: ""  # TODO
    wd_mm: null  # TODO

  channels:
    - index: 0
      name: "bp 655"
      laser_nm: null  # TODO: not in Cam_*.json
      exposure_ms: null  # TODO: not in Cam_*.json
    - index: 1
      name: "lp 696"
      laser_nm: null  # TODO: not in Cam_*.json
      exposure_ms: null  # TODO: not in Cam_*.json

acquisition:
  n_timepoints: 95
  interval_s: 900.0
  interval_min: 15.0
  total_duration_h: 23.5
  start_time: "2026-08-05 11:33:51"   # first frame, stack_0-ctrl 1
  end_time: "2026-08-06 11:03:51"     # last frame, stack_0-ctrl 1

stacks:

  - id: "stack_0-ctrl 1"
    condition: "ctrl"
    folder: "stack_0-ctrl 1_channel_0-bp 655_obj_bottom"
    notes: "has some wonky membrane to start, but hten you cna see individual cells protruding. snap is there but dim/bad. implants so icm is on top but not a super big/robust outgrowth"
  - id: "stack_1-ctrl"
    condition: "ctrl"
    folder: "stack_1-ctrl_channel_0-bp 655_obj_bottom"
    notes: "better h2b signal. some weird membrane vesicle things. isnt really attaching outgrowing and then icm is more on side/bottom and trying to implant. still inflating/collapsing lumen. is struggling and i think start to see more genuine but dim protrusions around 89."
  - id: "stack_2-ctrl"
    condition: "ctrl"
    folder: "stack_2-ctrl_channel_0-bp 655_obj_bottom"
    notes: "on the edge of a bubble. snap only but signal looks pretty good. is bopping around, not attched. i kind of think its trying to implant on the oil interface. makes the geometry really weird but pretty fucking sick and nice signal  of cell pileup and protrusions."
  - id: "stack_3-ctrl 4"
    condition: "ctrl"
    folder: "stack_3-ctrl 4_channel_0-bp 655_obj_bottom"
    notes: "nice h2b signal. is already implanting, kind of on side. big pileup of cells at mural. nice outgrowth, cool ptorusions, can kind of look at neighbor switching/behavior!"
  - id: "stack_4-meki 1"
    condition: "meki"
    folder: "stack_4-meki 1_channel_0-bp 655_obj_bottom"
    notes: "has some weird pile-up/lumen situation at mural. is trying to implant but protrusions seem weird/not strong. doesnt implant. "
  - id: "stack_5-meki 2"
    condition: "meki"
    folder: "stack_5-meki 2_channel_0-bp 655_obj_bottom"
    notes: " has some lil baby protrusions and small lumen. trying to implant. doesnt."
  - id: "stack_6-meki"
    condition: "meki"
    folder: "stack_6-meki_channel_0-bp 655_obj_bottom"
    notes: "starts with nice big lumen. pile up at mural. some cells really seem to be trying to implant but dont."
  - id: "stack_7-meki 4"
    condition: "meki"
    folder: "stack_7-meki 4_channel_0-bp 655_obj_bottom"
    notes: "small, funky, dying/no lumen. some trying to protrude and implant."

# ── Timecourse TIFF conversion ────────────────────────────────────────────────
# Run: python pipelines/timecourse/convert_h5_timecourse_to_tiff.py --config "configs/other live images/260804_c_meki_h2b_snap_2.yaml"
live_timecourse:
  root_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 2/2026-08-05_113254/raw"
  output_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 2/tifs"
  dataset_path: "Data"
  dtype: "uint16"

  # Per-stack manual crop overrides (from inspect_crop_bounds_timecourse.py),
  # scoped to this dataset -- not the shared configs/other live images/crop_overrides.yaml,
  # which would collide across datasets sharing that folder (run 1 of this same
  # experiment reuses the same stack_ids).
  crop_overrides_file: "crop_overrides_260804_c_meki_h2b_snap_2.yaml"

  per_timepoint: true          # write one ZYX TIFF per timepoint per stack subfolder
  skip_stacks: []    # TODO: any stack_ids to exclude, e.g. ["stack_0"]

  # Autocrop: computed from first + last timepoint (union), applied to all T.
  auto_crop: true
  auto_crop_channel: 0
  auto_crop_threshold_percentile: 80
  auto_crop_blur_sigma: 2
  pad: 20
