# ── Timecourse TIFF conversion ────────────────────────────────────────────────
# Run: python scripts/convert_h5_timecourse_to_tiff.py --config "configs/other live images/260721_e45c_fgf_oct4_snap.yaml"
live_timecourse:
  root_dir: "/mnt/md1/elysse/260721_E4.5c_fgf_oct4_snap/2026-07-21_184317/raw"
  output_dir: "/mnt/md1/elysse/260721_E4.5c_fgf_oct4_snap/tifs"
  dataset_path: "Data"
  dtype: "uint16"

  # Per-stack manual crop overrides (from inspect_crop_bounds_timecourse.py),
  # scoped to this dataset -- not the shared configs/other live images/crop_overrides.yaml,
  # which would collide across datasets sharing that folder.
  crop_overrides_file: "crop_overrides_260721_e45c_fgf_oct4_snap.yaml"

  per_timepoint: true          # write one ZYX TIFF per timepoint per stack subfolder
  skip_stacks: ["stack_1"]    # ch1 has 26 dropped h5/json frames scattered through the run (isolated write glitch,
                               # not seen elsewhere in this dataset) -- channel alignment breaks down past the first
                               # gap (~19:15). Revisit by hand if this embryo's data is needed.

  # Autocrop: computed from first + last timepoint (union), applied to all T.
  auto_crop: true
  auto_crop_channel: 0
  auto_crop_threshold_percentile: 80
  auto_crop_blur_sigma: 2
  pad: 20
