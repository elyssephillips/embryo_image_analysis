# ── Timecourse TIFF conversion ────────────────────────────────────────────────
# Run: python pipelines/timecourse/convert_h5_timecourse_to_tiff.py --config "configs/other live images/260804_c_meki_h2b_snap_3.yaml"
live_timecourse:
  root_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 3/2026-08-06_113118/raw"
  output_dir: "/mnt/md1/elysse/260804_c_meki_h2b_snap/run 3/tifs"
  dataset_path: "Data"
  dtype: "uint16"

  per_timepoint: true          # write one ZYX TIFF per timepoint per stack subfolder
  skip_stacks: []    # TODO: any stack_ids to exclude, e.g. ["stack_0"]

  # Autocrop: computed from first + last timepoint (union), applied to all T.
  auto_crop: true
  auto_crop_channel: 0
  auto_crop_threshold_percentile: 80
  auto_crop_blur_sigma: 2
  pad: 20
